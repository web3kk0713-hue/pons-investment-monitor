name: Daily PONS investment monitor

on:
  schedule:
    # 09:15 Asia/Shanghai every day (GitHub cron uses UTC).
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pons-monitor-pages
  cancel-in-progress: false

jobs:
  collect-test-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect daily snapshot
        run: node scripts/collect.mjs

      - name: Test decision rules
        run: node --test tests/*.test.mjs

      - name: Validate snapshot
        run: node scripts/validate-data.mjs

      - name: Save daily data history
        run: |
          git config user.name "pons-monitor-bot"
          git config user.email "pons-monitor-bot@users.noreply.github.com"
          git add site/data/latest.json site/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily PONS snapshot $(date -u +%F)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

